<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Velberry</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&family=Parisienne&family=Playfair+Display:ital,wght@0,400..700;1,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/velberry.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="checkout" data-chain="none" data-dock="off">
  <main id="main" class="bg-gingham-cream" style="min-height: 80vh">
    <div class="wrap">
      <header class="page-title"><span class="eyebrow">Almost yours</span><h1>Checkout</h1></header>
      <div data-test-banner></div>
      <div data-checkout></div>
    </div>
  </main>

  <dialog class="sheet mock-pay" data-mock aria-labelledby="mock-title">
    <header><strong id="mock-title">Test payment</strong><span class="muted">Local simulator — no real money moves</span></header>
    <div class="body">
      <p class="notice test">TEST MODE · Razorpay keys are not configured yet. This simulates the payment window so you can try the full journey.</p>
      <div class="muted" style="margin-top:14px">Amount</div>
      <div class="amount" data-mock-amount></div>
      <div class="row">
        <button class="btn btn-ghost" type="button" data-mock-fail>Simulate failure</button>
        <button class="btn" type="button" data-mock-pay>Pay (test)</button>
      </div>
      <p style="text-align:center;margin:14px 0 0"><button class="link-btn" type="button" data-mock-close>Cancel</button></p>
    </div>
  </dialog>
  <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
