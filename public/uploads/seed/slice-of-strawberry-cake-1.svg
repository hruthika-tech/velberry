<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
<defs>
  <pattern id="linen" width="6" height="6" patternUnits="userSpaceOnUse">
    <path d="M0 3h6M3 0v6" stroke="#fff" stroke-width=".7" opacity=".45"/>
  </pattern>
  <radialGradient id="spot" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#F9EEDD" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3B4"/><stop offset=".45" stop-color="#D8B26E"/><stop offset="1" stop-color="#A9823F"/></linearGradient>
  <filter id="clay" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="3.2" specularConstant=".42" specularExponent="22" lighting-color="#fff" result="spec">
      <feDistantLight azimuth="235" elevation="52"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .42  0 0 0 0 .27  0 0 0 0 .27  0 0 0 .07 0" result="speck"/>
    <feComposite in="speck" in2="SourceAlpha" operator="in" result="speckIn"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="speckIn"/><feMergeNode in="specIn"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6B4545" flood-opacity=".22"/>
  </filter>
</defs>
  <rect width="1000" height="1000" fill="#F9EEDD"/><rect width="1000" height="1000" fill="url(#linen)"/><rect width="1000" height="1000" fill="url(#spot)"/>
  <ellipse cx="500" cy="955" rx="230" ry="18" fill="#6B4545" opacity=".08"/>
  <g filter="url(#shadow)">
    <circle cx="500" cy="150" r="92" fill="none" stroke="url(#gold)" stroke-width="15"/>
    <path d="M430 92 A92 92 0 0 1 560 80" fill="none" stroke="#fff" stroke-width="4" opacity=".7" stroke-linecap="round"/>
    <ellipse cx="500" cy="249" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="271" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="293" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="315" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="337" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="359" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="381" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="403" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="425" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/>
    <circle cx="500" cy="435.6" r="14" fill="none" stroke="url(#gold)" stroke-width="5.5"/>
    <g transform="translate(190 330) scale(6.2)" filter="url(#clay)">
    <path d="M14 54 L84 44 L84 84 L14 90Z" fill="#FBEBC8" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M14 66 L84 58 M14 77 L84 71" stroke="#D197A2" stroke-width="5"/>
    <path d="M14 54 L48 34 L84 44Z" fill="#E6C0C9" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M14 54 Q18 60 22 54 Q26 60 30 53 Q34 59 38 52 Q42 58 46 51" fill="none" stroke="#6B4545" stroke-width="1.6" opacity=".5"/>
    <path d="M50 34 C58 32 62 22 56 18 C50 16 44 22 46 28Z" fill="#D9546A" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M50 18 L46 13 L54 15Z" fill="#9AB25A" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>