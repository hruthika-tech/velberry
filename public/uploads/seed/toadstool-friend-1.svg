    <circle cx="500" cy="448" r="14" fill="none" stroke="url(#gold)" stroke-width="5.5"/>
    <g transform="translate(190 330) scale(6.2)" filter="url(#clay)">
    <rect x="37" y="52" width="26" height="36" rx="11" fill="#FFF6E9" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M12 56 C12 24 88 24 88 56 C88 62 12 62 12 56Z" fill="#C96C80" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="32" cy="42" r="6" fill="#FFF6E9"/><circle cx="56" cy="34" r="5" fill="#FFF6E9"/><circle cx="72" cy="48" r="4" fill="#FFF6E9"/>
    
  <g transform="translate(50 70) scale(0.55)">
    <circle cx="-7" cy="0" r="1.9" fill="#6B4545"/><circle cx="7" cy="0" r="1.9" fill="#6B4545"/>
    <path d="M-2.6 2.4 Q0 5 2.6 2.4" fill="none" stroke="#6B4545" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="-11" cy="4" rx="3.2" ry="1.9" fill="#F28AA0" opacity=".55"/><ellipse cx="11" cy="4" rx="3.2" ry="1.9" fill="#F28AA0" opacity=".55"/>
  </g></g>
