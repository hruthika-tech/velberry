<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
<defs>
  <pattern id="linen" width="6" height="6" patternUnits="userSpaceOnUse">
    <path d="M0 3h6M3 0v6" stroke="#fff" stroke-width=".7" opacity=".45"/>
  </pattern>
  <radialGradient id="spot" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#F6E3E6" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3B4"/><stop offset=".45" stop-color="#D8B26E"/><stop offset="1" stop-color="#A9823F"/></linearGradient>
  <filter id="clay" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="3.2" specularConstant=".42" specularExponent="22" lighting-color="#fff" result="spec">
      <feDistantLight azimuth="235" elevation="52"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .42  0 0 0 0 .27  0 0 0 0 .27  0 0 0 .07 0" result="speck"/>
    <feComposite in="speck" in2="SourceAlpha" operator="in" result="speckIn"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="speckIn"/><feMergeNode in="specIn"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6B4545" flood-opacity=".22"/>
  </filter>
</defs>
  <rect width="1000" height="1000" fill="#F6E3E6"/><rect width="1000" height="1000" fill="url(#linen)"/><rect width="1000" height="1000" fill="url(#spot)"/>
  <ellipse cx="500" cy="955" rx="230" ry="18" fill="#6B4545" opacity=".08"/>
  <g filter="url(#shadow)">
    <circle cx="500" cy="150" r="92" fill="none" stroke="url(#gold)" stroke-width="15"/>
    <path d="M430 92 A92 92 0 0 1 560 80" fill="none" stroke="#fff" stroke-width="4" opacity=".7" stroke-linecap="round"/>
    <ellipse cx="500" cy="249" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="271" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="293" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="315" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="337" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="359" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="381" rx="8" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/><ellipse cx="500" cy="403" rx="3" ry="15" fill="none" stroke="url(#gold)" stroke-width="5.5"/>
    <circle cx="500" cy="410.8" r="14" fill="none" stroke="url(#gold)" stroke-width="5.5"/>
    <g transform="translate(190 330) scale(6.2)" filter="url(#clay)">
    <path d="M36 66 Q40 36 56 16 M64 64 Q62 38 56 16" fill="none" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M56 16 C66 10 78 14 82 22 C72 26 62 24 56 16Z" fill="#9AB25A" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="35" cy="72" r="16" fill="#D9546A" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="65" cy="70" r="16" fill="#C96C80" stroke="#6B4545" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M26 66 Q28 60 34 59" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/><path d="M56 64 Q58 58 64 57" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/></g>
  </g>
</svg>