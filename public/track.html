<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#FFF8EE">
  <title>Track Your Order — CLAYSLAY</title>
  <meta name="robots" content="noindex">
  <meta property="og:site_name" content="CLAYSLAY">
  <meta property="og:title" content="Track Your Order — CLAYSLAY">
  <meta property="og:description" content="Track your CLAYSLAY parcel.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&family=Parisienne&family=Playfair+Display:ital,wght@0,400..700;1,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/velberry.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="track" data-chain="slim" data-dock="off">
  <main id="main" class="bg-gingham-matcha" style="min-height: 75vh">
    <div class="wrap track-wrap">
      <header class="page-title"><span class="eyebrow">Where's my parcel?</span><h1>Track your little treasures</h1></header>
      <form class="panel stitched lookup" data-lookup novalidate>
        <div class="field"><label for="t-order">Order number</label><input id="t-order" name="orderNumber" placeholder="VB-261104-AB2CD" autocomplete="off" required></div>
        <div class="field"><label for="t-email">Email or mobile number used at checkout</label><input id="t-email" name="email" autocomplete="email" required></div>
        <button class="btn btn-block" type="submit">Find my order</button>
        <p class="muted" style="font-size:.85rem;margin:12px 0 0;text-align:center">Have an account? <a href="/account.html">Log in</a> to see all your orders.</p>
      </form>
      <div data-result aria-live="polite"></div>
    </div>
  </main>
  <script type="module" src="/js/pages/track.js"></script>
</body>
</html>
